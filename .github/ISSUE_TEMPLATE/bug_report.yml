name: Bug report
description: Something broke or behaved unexpectedly.
title: "bug: <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in every field — incomplete reports
        will be closed. Security issues must use the private advisory flow,
        not this template.
  - type: input
    id: env
    attributes:
      label: Environment
      description: Branch / commit SHA, browser, OS, deployment URL.
      placeholder: "main @ abc1234, Chrome 130 on macOS 14, https://pheno-sage-web.vercel.app"
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Numbered, deterministic steps. Include payloads if relevant.
      placeholder: |
        1. Navigate to /dashboard
        2. Click "New grow"
        3. Submit empty form
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, stack traces, request IDs.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
    validations: { required: false }
