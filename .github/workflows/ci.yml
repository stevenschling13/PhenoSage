name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"
  PYTHON_VERSION: "3.12"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  validate:
    name: Repo — Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Run the canonical guardrail chain from package.json so CI can never
      # drift from `pnpm run validate` (env contract, route boundaries,
      # imports, code-scanning patterns, file budgets, action pins, server
      # actions, smoke-script tests). A hand-maintained subset here is how
      # an unpinned third-party action slipped onto main in #213.
      - name: Guardrails (pnpm run validate)
        run: pnpm run validate
      - name: Route security audit
        run: pnpm run security:routes
      - name: Changed-scope (advisory)
        run: pnpm run check:scope -- --base=origin/${{ github.base_ref || 'main' }}
        continue-on-error: true
      - name: Format check
        run: pnpm run format:check
        continue-on-error: true
      - name: PR guardian (file/line caps)
        if: github.event_name == 'pull_request'
        run: pnpm run pr:guardian
        env:
          BASE: origin/${{ github.base_ref }}
          GUARDIAN_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'guardian:approved') && '1' || '0' }}
        continue-on-error: true

  test-web:
    name: Web — Lint, Type, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
      - name: Type check
        run: pnpm turbo run type-check --filter=web
      - name: Lint
        run: pnpm turbo run lint --filter=web
      - name: Unit tests (vitest)
        run: pnpm turbo run test --filter=web
      - name: Build
        run: pnpm turbo run build --filter=web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role
          ANALYSIS_SERVICE_URL: http://localhost:8000
          ANALYSIS_SERVICE_API_KEY: stub-api-key
          OPENAI_API_KEY: stub-openai-key
      - name: Bundle size summary
        if: always()
        run: |
          if [ -d apps/web/.next ]; then
            echo "## Next.js bundle size" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            total=$(du -sh apps/web/.next 2>/dev/null | awk '{print $1}')
            server=$(du -sh apps/web/.next/server 2>/dev/null | awk '{print $1}' || echo "n/a")
            static=$(du -sh apps/web/.next/static 2>/dev/null | awk '{print $1}' || echo "n/a")
            echo "| segment | size |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---------|------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| total (.next) | $total |" >> "$GITHUB_STEP_SUMMARY"
            echo "| .next/server | $server |" >> "$GITHUB_STEP_SUMMARY"
            echo "| .next/static | $static |" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore
          retention-days: 7

  test-shared:
    name: Shared — Type & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm turbo run type-check --filter=@phenosage/shared
      - name: Tests (vitest)
        run: pnpm turbo run test --filter=@phenosage/shared

  test-analysis:
    name: Analysis — Lint, Type, Test, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    defaults:
      run:
        working-directory: apps/analysis
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: apps/analysis/requirements.txt
      - name: Cache ruff
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruff
          key: ${{ runner.os }}-ruff-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/analysis/requirements.txt', 'apps/analysis/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-ruff-${{ env.PYTHON_VERSION }}-
      - name: Cache mypy
        uses: actions/cache@v5
        with:
          path: apps/analysis/.mypy_cache
          key: ${{ runner.os }}-mypy-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/analysis/requirements.txt', 'apps/analysis/pyproject.toml') }}-${{ hashFiles('apps/analysis/app/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/analysis/requirements.txt', 'apps/analysis/pyproject.toml') }}-
            ${{ runner.os }}-mypy-${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app/
      - name: Tests (pytest + coverage)
        run: pytest --cov=app --cov-report=xml --cov-report=term
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
        continue-on-error: true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-coverage
          path: apps/analysis/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Containers — Build + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    env:
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      # `load: true` puts the image in the local docker daemon so the
      # subsequent `docker compose up` and SBOM steps can use it by tag.
      # `cache-to: type=gha,mode=max` exports BOTH image layers AND the
      # `--mount=type=cache` data (pnpm store / Next cache / pip cache)
      # to the GitHub Actions cache backend; the next run pulls them via
      # `cache-from`. `scope=` partitions the cache per image so the two
      # builds don't fight for the same key.
      - name: Build web image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.web
          tags: phenosage-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build analysis image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.analysis
          tags: phenosage-analysis:ci
          load: true
          cache-from: type=gha,scope=analysis
          cache-to: type=gha,mode=max,scope=analysis
      - name: Validate compose config
        run: docker compose -f docker-compose.ci.yml config
      - name: Start containers
        run: docker compose -f docker-compose.ci.yml up -d --wait
      - name: Smoke-check container health
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml exec -T analysis python -c "import app.main"
      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: phenosage-web:ci
          format: spdx-json
          output-file: web-sbom.spdx.json
      - name: Generate analysis SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: phenosage-analysis:ci
          format: spdx-json
          output-file: analysis-sbom.spdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: container-sboms
          path: |
            web-sbom.spdx.json
            analysis-sbom.spdx.json
          retention-days: 7
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  ci-status:
    name: CI — All green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, test-web, test-shared, test-analysis, containers]
    if: always()
    steps:
      - name: Fail if any upstream job failed
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.test-web.result }}" != "success" ] || \
             [ "${{ needs.test-shared.result }}" != "success" ] || \
             [ "${{ needs.test-analysis.result }}" != "success" ] || \
             [ "${{ needs.containers.result }}" != "success" ]; then
            echo "One or more upstream jobs failed"
            exit 1
          fi
