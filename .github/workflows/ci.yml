name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Repo — Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Env contract
        run: pnpm run check:env
      - name: Route / server boundary
        run: pnpm run check:routes
      - name: Import / smoke
        run: pnpm run check:imports
      - name: Changed-scope (advisory)
        run: pnpm run check:scope -- --base=origin/${{ github.base_ref || 'main' }}
        continue-on-error: true

  web:
    name: Web — Lint & Type Check
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Provide stub values so Next.js build doesn't fail on missing env
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role
          ANALYSIS_SERVICE_URL: http://localhost:8000
          ANALYSIS_SERVICE_API_KEY: stub-api-key
          OPENAI_API_KEY: stub-openai-key

  analysis:
    name: Analysis — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analysis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/analysis/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/

      - name: Tests (pytest)
        run: pytest -q

  shared:
    name: Shared — Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter shared type-check

  notify-vercel:
    name: phenosage
    runs-on: ubuntu-latest
    needs: [validate, web, analysis, shared]
    if: always()
    permissions:
      contents: read
    steps:
      - name: notify vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - pheno-sage-web: phenosage"
